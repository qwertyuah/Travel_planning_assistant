services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: travel-agent-backend
    ports:
      - "8000:8000"
    environment:
      # 从根目录.env文件加载环境变量
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE_URL=${DEEPSEEK_API_BASE_URL}
      - TUNIU_API_KEY=${TUNIU_API_KEY}
      - TUNIU_API_BASE_URL=${TUNIU_API_BASE_URL}
      - BAIDU_SEARCH_URL=${BAIDU_SEARCH_URL}
      - BAIDU_API_KEY=${BAIDU_API_KEY}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - UNSPLASH_SECRET_KEY=${UNSPLASH_SECRET_KEY}
      - AMAP_API_KEY=${AMAP_API_KEY}
    networks:
      - travel-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel-agent-frontend
    ports:
      - "80:80"
    environment:
      # 前端环境变量
      - VITE_API_BASE_URL=/api
      - VITE_AMAP_WEB_KEY=${VITE_AMAP_WEB_KEY}
      - VITE_AMAP_WEB_JS_KEY=${VITE_AMAP_WEB_JS_KEY}
    depends_on:
      - backend
    networks:
      - travel-agent-network
    restart: unless-stopped

# 定义网络
networks:
  travel-agent-network:
    driver: bridge
